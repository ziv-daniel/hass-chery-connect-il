name: Bug report
description: Something in the integration does not work
body:
  - type: markdown
    attributes:
      value: >-
        Please attach the integration's diagnostics (device page → ⋮ →
        Download diagnostics). They are redacted. Do not paste raw logs or
        app traffic captures; they contain your token.
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Home Assistant and integration versions
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Drag the downloaded diagnostics file here.
