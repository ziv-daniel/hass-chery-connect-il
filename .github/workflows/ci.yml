name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runs on Ziv's self-hosted homelab runner pool (GitHub-hosted minutes are
# billing-blocked). PRs from forks fall back to GitHub-hosted runners so
# untrusted code never reaches the shared pool. Third-party actions are
# pinned to commit SHAs because they execute inside the home network;
# Dependabot (github-actions ecosystem) keeps the pins current.

jobs:
  test:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted","linux","x64","homelab"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # setup-python has no 3.14 build for the pool's Ubuntu 20.04 base;
      # uv's standalone Python builds are distro-independent.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements_test.txt
      - run: uv pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components
      - run: pytest --cov=custom_components.chery_connect --cov-report=term-missing

  hassfest:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted","linux","x64","homelab"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235 # master 2026-11-23

  hacs:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted","linux","x64","homelab"]') }}
    timeout-minutes: 10
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
